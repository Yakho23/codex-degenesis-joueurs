<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codex Degenesis</title>
<style>
@font-face{font-family:"Barlow Condensed";font-weight:500;font-display:swap;src:url(assets/fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(assets/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(assets/fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
/* Layout : appli plein écran téléphone, accueil en ruche, rubriques en pile avec en-tête collant. Thème unique sombre (charte Degenesis). */
@font-face{font-family:"Degenesis";src:url("assets/DEGENESIS-v0.1.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Calluna";src:url("assets/Calluna-Regular.otf") format("opentype");font-display:swap}
:root{
  --ink:#0b0b0b; --panel:#141312; --panel2:#1c1a18; --line:rgba(242,239,232,.16); --line2:rgba(242,239,232,.28);
  --fg:#F2EFE8; --mute:#BDB7AC; --dim:#8E887E; --red:#EC1E26; --red-d:#B3121A; --red-glow:rgba(236,30,38,.18);
  --f-dg:"Degenesis","Barlow Condensed",Impact,sans-serif;
  --f-body:"Calluna",Georgia,"Times New Roman",serif;
  --f-ui:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --tex1:url("assets/BG_BLACK_1.jpg"); --tex2:url("assets/BG_BLACK_12.jpg");
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.ground{position:fixed;inset:0;z-index:-1;background-color:var(--ink);background-image:linear-gradient(rgba(8,8,8,.55),rgba(8,8,8,.86)),var(--tex1);background-size:cover;background-position:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.dg{font-family:var(--f-dg);letter-spacing:.08em;font-weight:400}
.ui{font-family:var(--f-ui);letter-spacing:.04em}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ACCUEIL */
.home{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-block:28px 24px;gap:20px;position:relative}
.home header{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:14px}
.home header img{width:min(250px,64vw);height:auto}
.home header p{margin:0;font-size:15px;letter-spacing:.42em}
.switch{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:rgba(11,11,11,.6);display:grid;place-items:center;padding:0}
.switch svg{width:21px;height:21px}
.hive{position:relative;width:340px;height:326px;max-width:100%;transform-origin:top center}
.hex{position:absolute;width:108px;height:125px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--line2);border:0;padding:0;transition:transform .15s ease, background .15s}
.hex .in{position:absolute;inset:2px;clip-path:inherit;background-color:#141414;background-image:linear-gradient(rgba(16,16,16,.8),rgba(16,16,16,.92)),var(--tex2);background-size:500px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--fg)}
.hex:hover,.hex:focus-visible{background:var(--red);transform:scale(1.04)}
.hex .num{font-size:11px;color:var(--red);letter-spacing:.15em}
.hex .lab{font-size:13px;letter-spacing:.06em}
.hex svg{width:30px;height:30px}
.hex.core{background:var(--red);pointer-events:none}
.hex.core .in{background:var(--red);inset:0}
.grid6{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:150px;padding:14px 14px 16px;border:1px solid var(--line);border-top:3px solid var(--red);background-color:#121212;background-image:linear-gradient(rgba(14,14,14,.82),rgba(14,14,14,.92)),var(--tex2);background-size:600px auto;text-align:left;color:var(--fg)}
.tile:hover{border-color:var(--line2)}
.tile .num{font-size:13px;color:var(--red);letter-spacing:.15em}
.tile svg{width:46px;height:46px;align-self:center}
.tile .lab{font-size:18px;letter-spacing:.08em;display:block}
.tile small{font-size:12.5px;color:var(--mute);display:block;margin-top:3px;font-family:var(--f-body)}
.home footer{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px;letter-spacing:.3em}
.home footer i{width:40px;height:1px;background:var(--line2)}

/* RUBRIQUE */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,11,11,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:10px;min-height:56px}
.back{width:44px;height:44px;border:1px solid var(--line2);background:transparent;border-radius:22px;display:grid;place-items:center;padding:0;flex:none}
.back svg{width:20px;height:20px}
.top h1{margin:0;font-size:21px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .roman{color:var(--red);font-size:13px;letter-spacing:.2em}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
/* Souris (PC) : les puces passent à la ligne au lieu de défiler */
@media (hover:hover) and (pointer:fine){.tabs{flex-wrap:wrap;overflow-x:visible}}
.chip{flex:none;border:1px solid var(--line2);background:transparent;border-radius:3px;padding:7px 11px;font-family:var(--f-ui);font-size:15px;letter-spacing:.04em;color:var(--mute);min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip svg{width:16px;height:16px}
main{flex:1;padding-block:14px 40px}
.stack{display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);padding:0 12px;min-height:46px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px;padding:10px 0}
.search svg{width:18px;height:18px;color:var(--dim);flex:none}
.count{font-family:var(--f-ui);color:var(--dim);font-size:14px;letter-spacing:.05em}
.card{border:1px solid var(--line);background:var(--panel);}
details.card>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:baseline;gap:10px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .t{flex:1;min-width:0;font-size:17px}
details.card>summary .ref{font-family:var(--f-ui);font-size:13px;color:var(--dim);white-space:nowrap}
details.card[open]>summary{border-bottom:1px solid var(--line)}
details.card[open]>summary .t{color:#fff}
.body{padding:12px 14px 14px;font-size:15.5px;color:var(--fg);overflow-x:auto}
.body p{margin:0 0 .6em}.body ul,.body ol{margin:0 0 .6em;padding-left:1.15em}.body li{margin:.15em 0}
.body b{color:#fff}
.body table{border-collapse:collapse;width:100%;margin:.2em 0 .7em;font-size:14.5px}
.body th,.body td{border-bottom:1px solid var(--line);padding:5px 8px 5px 0;text-align:left;vertical-align:top}
.body th{font-family:var(--f-ui);font-weight:600;color:var(--mute);letter-spacing:.04em}
.body dl{margin:0}.body dt{font-family:var(--f-ui);font-weight:700;color:#fff;letter-spacing:.04em;margin-top:.5em}.body dd{margin:0 0 0 0;color:var(--mute)}
.catline{font-family:var(--f-ui);font-size:13px;color:var(--red);letter-spacing:.14em;text-transform:uppercase}
.empty{padding:28px 6px;text-align:center;color:var(--dim)}
.sec-title{font-size:15px;color:var(--mute);margin:18px 0 8px;letter-spacing:.14em}

/* BAZAR */
.item>summary{flex-wrap:wrap}
.item .stats{width:100%;display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-ui);font-size:14.5px;color:var(--mute)}
.item .stats b{color:var(--fg);font-weight:600}
.cult{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-ui);font-size:13px;color:var(--red);letter-spacing:.05em}
.cult svg{width:15px;height:15px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:15px}
.kv dt{font-family:var(--f-ui);color:var(--dim);letter-spacing:.04em;margin:0}
.kv dd{margin:0}
.selrow{display:flex;gap:8px;flex-wrap:wrap}
select.sel{background:var(--panel);border:1px solid var(--line2);padding:9px 10px;min-height:44px;font-family:var(--f-ui);font-size:15px;flex:1;min-width:140px}

/* DES */
.dice-panel{border:1px solid var(--line);background:var(--panel);padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.lbl{font-family:var(--f-ui);font-size:14px;color:var(--mute);letter-spacing:.12em;text-transform:uppercase}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:52px;height:52px;border:1px solid var(--line2);background:var(--panel2);font-size:26px;line-height:1;font-family:var(--f-ui);display:grid;place-items:center}
.stepper output{flex:1;text-align:center;font-family:var(--f-ui);font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stepper.sm button{width:40px;height:40px;font-size:20px}
.stepper.sm output{font-size:28px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.roll{width:100%;min-height:58px;border:0;background:var(--red);color:#fff;font-family:var(--f-dg);font-size:22px;letter-spacing:.2em}
.roll:active{background:var(--red-d)}
.result{display:flex;flex-direction:column;gap:12px}
.dice{display:flex;flex-wrap:wrap;gap:7px}
.negtog{display:flex;flex-wrap:wrap;gap:6px}
.neg-ask{color:#fff;font-size:20px}
.neg-res{display:grid;grid-template-columns:1fr;gap:6px}
.neg-res>div{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:baseline;padding:8px 10px;border:1px solid var(--line);background:#16140f}
.neg-res span{font-family:var(--f-ui);letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.neg-res b{font-size:18px;color:#fff;text-align:right}
.neg-res i{grid-column:1/-1;font-style:normal;color:var(--dim);font-size:14px}
.neg-res .ok span{color:#d9bd7c}.neg-res .ok{border-color:#6e5f3c}
.neg-res .cr{border-color:var(--red)}.neg-res .cr span{color:var(--red)}
.pot .pn{color:var(--red);font-family:var(--f-ui);letter-spacing:.04em}
.pot .pc{display:block;margin-top:3px;font-family:var(--f-ui);font-size:14px;letter-spacing:.03em;color:var(--dim)}
.pot .body .k,.item .desc .k{font-family:var(--f-ui);color:var(--dim);letter-spacing:.06em;font-size:14px;text-transform:uppercase;display:block}
.item .desc{display:flex;flex-direction:column;gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.item .desc p{margin:0}
details.card.sheet>summary{display:flex;align-items:center;gap:14px}
.sheet .t{line-height:1.25}
.sheet .av{width:52px;height:52px;flex:none;border-radius:50%;object-fit:cover;object-position:center 30%;background:#000;border:1px solid var(--line2)}
.sheet .av.noimg{display:grid;place-items:center;color:var(--dim);font-size:22px}
.sheet .t .st{display:block;font-family:var(--f-ui);font-size:14px;letter-spacing:.03em;color:var(--red);margin-top:2px}
.sheet .t .cmp{display:block;font-family:var(--f-ui);font-size:13px;color:var(--dim)}
.sheet .body p{margin:0 0 8px}
.sheet .sh{font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin:16px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.sheet h4{font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#fff;margin:14px 0 6px}
.sheet h5{font-family:var(--f-ui);font-weight:600;font-size:14px;letter-spacing:.05em;color:var(--fg);margin:10px 0 4px}
.body .statl,.statl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;align-items:baseline;margin:0 0 14px;font-size:14.5px;line-height:1.4}
.statl dt{font-family:var(--f-ui);font-weight:600;color:var(--dim);letter-spacing:.04em;margin:0}
.statl dd{margin:0;color:var(--fg)}
.sheet .ph.big{display:block;margin:0 auto 12px;max-width:260px;border:0;padding:0;background:none}
.sheet .ph.big img{width:100%;display:block;border:1px solid var(--line2)}
.grpintro{border-style:dashed}
.crit{border-left:3px solid var(--red);padding:6px 10px;background:rgba(236,30,38,.12);color:#fff;font-family:var(--f-ui);letter-spacing:.03em}
.critx{color:var(--red);font-weight:700}
.die{width:46px;height:46px;display:grid;place-items:center;background:#16140f;border:1.5px solid var(--line2);border-radius:7px}
.die img{width:86%;height:86%;display:block}
.die.s{border-color:#b39a62;background:#1f1b12}
.die.t{border-color:var(--red);background:var(--red)}
.die.o{border-color:var(--red);border-style:dashed}
@media (prefers-reduced-motion:no-preference){.die{animation:pop .28s ease both}@keyframes pop{from{transform:scale(.6) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}}
.verdict{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px}
.verdict .big{font-family:var(--f-dg);font-size:24px;letter-spacing:.1em}
.verdict .big.ok{color:var(--fg)} .verdict .big.ko{color:var(--red)}
.tally{display:flex;gap:16px;font-family:var(--f-ui);font-size:18px;color:var(--mute)}
.tally b{color:#fff;font-size:26px;margin-right:4px}
.hist{display:flex;flex-direction:column;gap:2px;font-family:var(--f-ui);font-size:14.5px;color:var(--dim)}
.hist div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:5px 0}
.diffs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.diffs .chip{min-width:0;justify-content:center}

/* GENERATEURS & OUTILS */
.gen-card{border:1px solid var(--line);border-top:3px solid var(--red);background-color:var(--panel);background-image:linear-gradient(rgba(20,19,18,.88),rgba(20,19,18,.95)),var(--tex2);background-size:600px auto;padding:16px 14px;display:flex;flex-direction:column;gap:8px}
.gen-card h2{margin:0;font-family:var(--f-body);font-size:24px;font-weight:400;color:#fff;text-wrap:balance}
.gen-card .meta{font-family:var(--f-ui);color:var(--red);letter-spacing:.06em;font-size:15px}
.gen-card p{margin:0}
.gen-card .k{font-family:var(--f-ui);color:var(--dim);letter-spacing:.06em;font-size:14px;text-transform:uppercase;display:block}
.btn{min-height:46px;border:1px solid var(--line2);background:var(--panel2);padding:8px 14px;font-family:var(--f-ui);font-size:16px;letter-spacing:.06em}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
/* Lore */
details.card.lore>summary{align-items:center;padding:10px 12px}
.lore .lt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lore .lt .t{display:flex;align-items:center;gap:7px}
.lore .lsub{font-family:var(--f-ui);font-size:13px;color:var(--red);letter-spacing:.06em;text-transform:uppercase}
.lic{display:inline-flex;color:var(--red);flex:none}.lic svg{width:20px;height:20px}
.lthumb{width:52px;height:52px;object-fit:cover;flex:none;border:1px solid var(--line);filter:saturate(.85)}
.lsym{width:40px;height:40px;object-fit:contain;flex:none;border-radius:4px;background:#000}
.lhero{display:block;width:calc(100% + 28px);margin:-12px -14px 12px;padding:0;border:0;background:#000;cursor:zoom-in}
.lhero img{display:block;width:100%;max-height:260px;object-fit:cover}
.body .quote{font-style:italic;color:var(--mute);border-left:2px solid var(--red);padding-left:10px}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line2)}
.timeline li{position:relative;padding:0 0 12px 10px;display:flex;flex-direction:column;gap:1px}
.timeline li::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;background:var(--red);transform:rotate(45deg)}
.timeline b{font-family:var(--f-ui);font-size:17px;color:#fff;letter-spacing:.04em}
.timeline span{color:var(--fg);font-size:15px}
.gloss{margin:0;display:flex;flex-direction:column;gap:2px}
.gloss>div{border-bottom:1px solid var(--line);padding:8px 2px}
.gloss dt{font-family:var(--f-ui);font-weight:700;color:#fff;letter-spacing:.04em;font-size:16px}
.gloss dd{margin:2px 0 0;color:var(--mute);font-size:15px}
.lgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:6px}
.lgal button{padding:0;border:1px solid var(--line);background:#000;cursor:zoom-in;display:flex;flex-direction:column}
.lgal img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.lgal span{font-family:var(--f-ui);font-size:12.5px;color:var(--mute);padding:3px 4px;letter-spacing:.04em}
.tarot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tarot figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:min(44%,170px)}
.tarot img{width:100%;height:auto;display:block}
.tarot figcaption{font-family:var(--f-ui);font-size:15px;letter-spacing:.05em;text-align:center}
.oracle-txt{font-size:17px;line-height:1.5}
.oracle-txt b{font-family:var(--f-ui);font-size:19px;letter-spacing:.04em;color:#fff;display:block;margin-bottom:4px}

/* CAMPAGNE */
.hero-c{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.hero-c h2{margin:0;font-family:var(--f-dg);font-size:30px;letter-spacing:.12em;font-weight:400}
.hero-c p{margin:0;font-family:var(--f-ui);color:var(--mute);letter-spacing:.05em}
.pc{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 12px;padding:12px 14px;align-items:start}
.pc img{width:64px;height:64px;object-fit:cover;border-radius:50%;grid-row:span 3;background:#000}
.pc h3{margin:0;font-family:var(--f-body);font-weight:400;font-size:20px;color:#fff}
.pc .l{font-family:var(--f-ui);color:var(--red);letter-spacing:.05em;font-size:14px}
.pc p{margin:4px 0 0;font-size:14.5px;color:var(--mute);grid-column:1/-1}
.pc .sk{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--f-ui);font-size:14px;color:var(--dim)}
.pc .sk b{color:var(--fg);font-weight:600}
.npc{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 12px;padding:10px;align-items:start}
.npc .ph{width:84px;height:84px;object-fit:cover;background:#000;border:1px solid var(--line);cursor:zoom-in;padding:0}
.npc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.npc .noimg{width:84px;height:84px;display:grid;place-items:center;border:1px solid var(--line);color:var(--dim);font-family:var(--f-dg);font-size:28px}
.npc h3{margin:0;font-weight:400;font-size:18px;color:#fff}
.npc .r{font-family:var(--f-ui);font-size:13.5px;color:var(--red);letter-spacing:.05em}
.npc p{margin:2px 0 0;font-size:14.5px;color:var(--mute)}
textarea.notes{width:100%;box-sizing:border-box;min-height:220px;background:var(--panel);border:1px solid var(--line2);padding:12px;font-family:var(--f-body);font-size:16px;line-height:1.5;resize:vertical}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}
.zoom.wide{align-items:flex-start;justify-content:flex-start}
.zoom.wide img{max-width:none;max-height:none;width:1400px}
.zoom .x{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);background:#000;color:#fff;font-size:22px}
.note{font-size:13.5px;color:var(--dim);font-family:var(--f-ui);letter-spacing:.03em}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--red);color:#fff;font-family:var(--f-ui);padding:10px 16px;z-index:60;letter-spacing:.05em}
@media (max-width:380px){.hive{transform:scale(.9)}.hex .lab{font-size:12px}}
.lore .body h4{font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin:16px 0 6px;padding-top:8px;border-top:1px solid var(--line)}
.lore .body ul{padding-left:20px;margin:0 0 10px}.lore .body li{margin:0 0 5px}.lieu .litems p{margin:0 0 9px}.lieu .litems b{color:#fff;font-family:var(--f-ui);font-weight:600;letter-spacing:.02em}
.fiche{border:1px solid var(--line);border-left:3px solid var(--red);background:rgba(255,255,255,.03);padding:10px 12px 2px;margin:0 0 14px}
.fiche .fh{font-family:var(--f-ui);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);margin:0 0 8px}
.fiche .statl{display:block;font-size:14.5px;margin-bottom:10px}.fiche .statl dt{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin:9px 0 1px}.fiche .statl dt:first-child{margin-top:0}.fiche .statl dd{margin:0}
.prophetie{border-left:3px solid var(--red);padding:4px 0 4px 14px;margin:14px 0 4px;font-style:italic;color:var(--fg);letter-spacing:.01em}.prophetie p{margin:0 0 1em;line-height:1.55}
.rulebox h3{font-family:var(--f-ui);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:#fff;margin:12px 0 6px}.rulebox h3 small{font-size:12px;color:var(--dim);letter-spacing:0;text-transform:none;margin-left:6px}.rulebox .body{padding:0;overflow-x:auto}.rulebox .body p{margin:0 0 8px}.rulebox table{width:100%;border-collapse:collapse;font-size:13px;margin:0 0 10px}.rulebox th,.rulebox td{border:1px solid var(--line);padding:4px 6px;text-align:left}
.hmain{width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}.hsearch{box-sizing:border-box;width:100%;margin:0}.hmain.ruche .hsearch{max-width:340px}
.gsearch{max-width:640px;margin:0 auto 30px;width:100%;text-align:left}
.gres{margin:0 0 16px}.gres .sec-title{display:flex;align-items:center;gap:8px}.gres .gn{font-family:var(--f-ui);font-size:12px;color:var(--dim);letter-spacing:0}
.hit{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);padding:10px 12px;margin:0 0 6px;color:var(--fg);cursor:pointer;font:inherit}
.hit:hover,.hit:focus-visible{border-color:var(--red)}
.hit .ht{font-size:16px}.hit .hs{font-family:var(--f-ui);font-size:13px;color:var(--dim)}
.gres .more{width:100%}
.flash{outline:2px solid var(--red);outline-offset:2px;transition:outline-color 1.4s}
.qclr{flex:none;width:32px;height:32px;margin-right:-6px;border:0;border-radius:50%;background:var(--line);color:var(--fg);font-size:20px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
.qclr:hover{background:var(--red);color:#fff}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.gtitle{display:flex;align-items:baseline;gap:8px;font-family:var(--f-ui);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--red);margin:0 0 8px}.gtitle .gn{font-weight:400;font-size:13px;color:var(--dim);letter-spacing:0}
